losing, and all the tiny details. If you host, have any kind of event coming up, lead team meetings, or just like being in group settings, this will change how you bring people together with real intentionality. I've gone back to it so many times and gifted it to so many people over the years.", "pt": {"y": false, "age": null, "pop": 2.0, "pers": "Insufferable"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Either"}, "teach": {"y": true, "explore": "\ud83d\udccb Your work", "facts": 2.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Either"}, "hw": {"y": false, "tissue": 1.0, "ctype": null, "emotion": null, "fmt": "Either"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}, "cov": "/reads/covers/2e36b89606.webp"}, {"t": "Thinking, Fast and Slow", "a": "Daniel Kahneman", "r": 4.5, "fav": true, "type": "Nonfic", "p": 499.0, "y": 2011.0, "rev": "Wow, a truly life-changing read with wisdom that hasn't left me since. One massive caveat that you have to approach this one as exactly what it is: a textbook, not a breezy pop-psych read. It took me nearly all of COVID to finish this book, not from boredom but because it's so densely packed with important research that I reread several chapters 2-3x to let it sink in. If you let it, this book will genuinely change how you think. One of my favorites, just budget real time for it, and if you want my playbook: read a dozen other more \"fun\" books at the same time.", "pt": {"y": false, "age": null, "pop": 4.0, "pers": "Insufferable"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Book"}, "teach": {"y": true, "explore": "\ud83e\udde0 Your brain", "facts": 5.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Book"}, "hw": {"y": false, "tissue": 1.0, "ctype": null, "emotion": null, "fmt": "Book"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}, "cov": "/reads/covers/11e7965b99.webp"}, {"t": "Delivering Happiness: A Path to Profits, Passion, and Purpose", "a": "Tony Hsieh", "r": 4.0, "fav": true, "type": "Nonfic", "p": 246.0, "y": 2000.0, "rev": "Tony Hsieh traces his path from childhood side hustles through founding LinkExchange, selling it to Microsoft, and eventually building Zappos into a billion-dollar shoe company famous for its customer service. What makes it stick is how deliberately he ties Zappos's unconventional culture, its core values, its hiring and firing practices, its obsession with employee happiness as a business strategy, to actual research on well-being rather than just startup mythology. Part memoir, part business book, and genuinely fun to read even if you have zero interest in shoes. One of my favorites, and it holds up as a blueprint decades later.", "pt": {"y": false, "age": null, "pop": 3.0, "pers": "Casual"}, "insp": {"y": true, "by": "Underdog", "fmt": "Audiobook"}, "teach": {"y": true, "explore": "\ud83d\udccb Your work", "facts": 2.0}, "cozy": {"y": false, "laugh": "DryWit", "fmt": "Audiobook"}, "hw": {"y": false, "tissue": 1.0, "ctype": null, "emotion": null, "fmt": "Audiobook"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}, "cov": "/reads/covers/f1ba309b44.webp"}, {"t": "I'll Have What She's Having", "a": "Chelsea Handler", "r": 4.0, "fav": false, "type": "Memoir", "p": 320.0, "y": 2025.0, "rev": "Obviously very unserious as book recs go, but I'm genuinely intrigued by Chelsea Handler as a person and how she's grown over the decades. This essay collection tracks her journey from a raucous, curmudgeonly, crass twenty-something to the 50-year-old version of her now, sorta wise, psychedelic step-dad vibes, balancing outrageous stories with real vulnerability along the way. Themes of gratitude, actually feeling comfortable in her own skin, using your voice, and lifting other people up run through the whole thing. With plenty of laughs along the way.", "cov": "/reads/covers/2f60217d5a.webp", "col": "#aa7265", "pt": {"y": false, "age": null, "pop": 3.0, "pers": "Casual"}, "insp": {"y": false, "by": "N/A", "fmt": "Audiobook ONLY"}, "teach": {"y": false, "explore": null, "facts": null}, "cozy": {"y": true, "laugh": "Cackle", "fmt": "Audiobook ONLY", "sunday": "Laugh"}, "hw": {"y": false, "tissue": 1.0, "ctype": null, "emotion": null, "fmt": "Audiobook ONLY"}, "fem": {"y": true, "night": "Magic Mike", "real": true}, "wild": {"y": false}}, {"t": "How to Be an Antiracist", "a": "Ibram X. Kendi", "r": 5.0, "fav": false, "type": "Nonfic", "p": 305.0, "y": 2019.0, "rev": "This is the quintessential post-George Floyd, 2020, white-American required reading, and while plenty has been written since, it still had a massive impact on me and on our broader conversation, for good reason. Ibram X. Kendi is exceptional in his work and refuses to let anyone hide in the middle: his central argument is that there's no such thing as 'not racist,' only racist or antiracist, in your beliefs and in the policies you support. He backs it up by tracing racist ideas through American history while weaving in his own reckoning with beliefs he once held himself. Kendi is masterful and deserves every bit of the flowers he got for this important read.", "pt": {"y": false, "age": null, "pop": 5.0, "pers": "Casual"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Audiobook"}, "teach": {"y": true, "explore": "\ud83c\udf0e Our society", "facts": 3.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Audiobook"}, "hw": {"y": false, "tissue": 1.0, "ctype": null, "emotion": null, "fmt": "Audiobook"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": false}, "cov": "/reads/covers/c51f38d520.webp"}, {"t": "The Power of Different: The Link Between Disorder and Genius", "a": "Gail Saltz", "r": 3.5, "fav": false, "type": "Nonfic", "p": 256.0, "y": 2017.0, "rev": "Gail Saltz makes a compelling case that conditions like ADHD, dyslexia, autism, anxiety, and bipolar disorder aren't just deficits to manage, they can be wired directly into extraordinary creativity and achievement. She backs it up with case studies of real innovators across science, business, and the arts, walking through the neuroscience of why heightened pattern recognition or divergent thinking can come packaged with real struggle. It's optimistic without ever being dismissive of how hard these conditions can actually be to live with. A genuinely useful reframe for anyone who's ever been told their brain is the problem.", "pt": {"y": false, "age": null, "pop": 1.0, "pers": "Casual"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Audiobook"}, "teach": {"y": true, "explore": "\ud83e\udde0 Your brain", "facts": 2.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Audiobook"}, "hw": {"y": false, "tissue": 1.0, "ctype": null, "emotion": null, "fmt": "Audiobook"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": false}, "cov": "/reads/covers/c274cc3900.webp"}, {"t": "The Coddling of the American Mind: How Good Intentions and Bad Ideas Are Setting up a Generation for Failure", "a": "Jonathan Haidt, Greg Lukianoff", "r": 5.0, "fav": true, "type": "Nonfic", "p": 352.0, "y": 2018.0, "rev": "One of my favorite ! ever ! books ! to ! recommend!! In 2018 early days of today's 'cancel culture', Jonathan Haidt and Greg Lukianoff made the case that we've been loving young people into fragility, protecting them from discomfort so thoroughly that we've made them more anxious, not less. Their 3 'Great Untruths' (what doesn't kill you makes you weaker, your feelings are always right, and life is a battle between good people and evil people) run through everything from campus free speech meltdowns to the youth mental health crisis. It's rigorous but never dry, grounded in cognitive behavioral therapy research and genuinely persuasive whether or not you fully agree with where they land. This will change how you parent, how you argue with people at dinner, how you feel about our silencing of far-right crazies. I didn't agree with everything but it shifted my views and ooh I liked it. Consider your assumptions officially rattled.", "pt": {"y": false, "age": null, "pop": 2.0, "pers": "Insufferable"}, "insp": {"y": false, "by": "N/A", "fmt": "Either"}, "teach": {"y": true, "explore": "\ud83c\udf0e Our society", "facts": 3.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Either"}, "hw": {"y": false, "tissue": 1.0, "ctype": null, "emotion": null, "fmt": "Either"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}, "cov": "/reads/covers/74be46e137.webp"}, {"t": "Crucial Conversations: Tools for Talking When Stakes are High", "a": "Kerry Patterson, Stephen R. Covey, Joseph Grenny, Ron McMillan, Al Switzler", "r": 5.0, "fav": true, "type": "Nonfic", "p": 240.0, "y": 2002.0, "rev": "This is the quintessential \"framework\" business book, but the rare one people actually use. Best for a new manager or someone who is conflict-avoidant that needs to stop up to the plate. They define crucial conversations as ones where (1) participants hold different opinions, (2) stakes are high, and (3) emotions run strong. That combo makes for a different approach to tackling these. The authors break down why most of us default to silence or aggression right when a conversation turns emotionally loaded, but give us the real tools to navigate it. I really like their advice for how to actually \"restore safety\" once things go sideways. Caveat: it's 25 years old at this point, so it leans white/male centric and some of the examples and language could definitely use a 2026 refresh, but the core framework still holds up.", "pt": {"y": false, "age": null, "pop": 4.0, "pers": "Casual"}, "insp": {"y": false, "by": "N/A", "fmt": "Book"}, "teach": {"y": true, "explore": "\ud83d\udc6cYour relationships", "facts": 4.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Book"}, "hw": {"y": false, "tissue": 1.0, "ctype": null, "emotion": null, "fmt": "Book"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}, "cov": "/reads/covers/c735dadbc6.webp"}, {"t": "Why We're Polarized", "a": "Ezra Klein", "r": 5.0, "fav": true, "type": "Nonfic", "p": 336.0, "y": 2020.0, "rev": "This is Ezra Klein before he went full Ezra Klein on us, if you know what I mean. His theory: politics uses us for its own ends, we're captives, not participants, and the two party system herds voters into corrals they can't leave for fear the other side might win. He writes, \"We are so locked into our political identities that there is virtually no candidate, no information, no condition, that can force us to change our minds.\" If you want to actually understand the psychology behind increasing polarization in American politics, this is fascinating and clear-eyed rather than partisan. Klein offers an excellent diagnosis of the problem, the challenge now is coming up with a solution.", "pt": {"y": false, "age": null, "pop": 3.0, "pers": "Insufferable"}, "insp": {"y": false, "by": "N/A", "fmt": "Audiobook"}, "teach": {"y": true, "explore": "\ud83c\udf0e Our society", "facts": 3.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Audiobook"}, "hw": {"y": false, "tissue": 1.0, "ctype": null, "emotion": null, "fmt": "Audiobook"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}, "cov": "/reads/covers/23fe965548.webp"}, {"t": "Magic Pill: The Extraordinary Benefits and Disturbing Risks of the New Weight-Loss Drugs", "a": "Johann Hari", "r": 3.5, "fav": false, "type": "Nonfic", "p": 320.0, "y": 2024.0, "rev": "Johann Hari turns his own experience taking Ozempic into a jumping-off point for a much bigger investigation: what these GLP-1 drugs actually do, who benefits, and who gets left behind. He talks to scientists, doctors, patients, and pharmaceutical executives to weigh the genuinely extraordinary results against real risks, like unknown long-term effects, cost, and access inequities that break down along predictable lines. Along the way he digs into why obesity rates exploded in the first place, pointing hard at ultra-processed food and the food industry's role in engineering appetite itself. Worth a heads-up that it's a deep dive into weight and diet culture, so it may hit differently depending on your own relationship with either. Nuanced rather than alarmist, and refreshingly honest about how much is still unknown.", "cov": "/reads/covers/b93702b472.webp", "col": "#dad6bf", "pt": {"y": false, "age": null, "pop": 2.0, "pers": "Casual"}, "insp": {"y": false, "by": "N/A", "fmt": "Audiobook"}, "teach": {"y": true, "explore": "\ud83d\udc64 Your body", "facts": 2.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Audiobook"}, "hw": {"y": false, "tissue": 1.0, "ctype": null, "emotion": null, "fmt": "Audiobook"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": false}}, {"t": "Reagan: His Life and Legend", "a": "Max Boot", "r": 3.5, "fav": false, "type": "Nonfic", "p": 880.0, "y": 2024.0, "rev": "This one is for history enthusiasts. Caveat: it's a beast, 880 pages,but it reads like a college course on how we got here. I read it during Trump's second inauguration, and it was eerie watching the chapter reflect that week's headlines, Trump's team copy/pasted the Reagan tell-them-what-they-wanna-hear playbook. Reagan's path is fascinating: Warner Bros dropped him as his acting career stalled, but as Screen Actors Guild president he'd granted his agent's company a conflict-of-interest waiver, which landed him the General Electric Theater hosting gig, and those GE years are what taught him substance mattered less than reading a room. My one critique: Boot is so focused on dispelling the myths that I never understood why people loved Reagan enough to reelect him in a landslide. I learned a lot, and left it angry about how much of this feels like a repeat.", "cov": "/reads/covers/e22fbfacec.webp", "col": "#aca895", "pt": {"y": false, "age": null, "pop": 2.0, "pers": "Casual"}, "insp": {"y": false, "by": "N/A", "fmt": "Either"}, "teach": {"y": true, "explore": "\ud8 ing out with Michael Jackson (eek!), but he's self-deprecating enough that it never feels insufferable, and he clearly knows a good jam. This is set before his Grammy-winning producer career, about learning to DJ in New York nightclubs in the 90s. It'll have you yearning to be a club rat in 90s. There's a funky cast of characters, and he takes pauses to reckon with his privilege as a white Jewish guy inside a Black hip-hop scene. Definitely more vibe than introspection, but a fun time. Bonus: he names the deep cuts he used to spin, compiled into a dope Spotify playlist -- search \"Night People, Mark Ronson by Doron Chester\".", "cov": "/reads/covers/46708cc180.webp", "col": "#790840", "pt": {"y": true, "age": "Teen", "pop": 3.0, "pers": "Casual", "hook": "Plot"}, "insp": {"y": false, "by": "N/A", "fmt": "Either"}, "teach": {"y": false, "explore": null, "facts": null}, "cozy": {"y": true, "laugh": "DryWit", "fmt": "Either", "sunday": "TEDTalk"}, "hw": {"y": false, "tissue": 2.0, "ctype": null, "emotion": null, "fmt": "Either"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": false}}, {"t": "The Vanity Fair Diaries: 1983-1992", "a": "Tina Brown", "r": 4.0, "fav": false, "type": "Memoir", "p": 448.0, "y": 2017.0, "rev": "Tina Brown kept the receipts, literally, and this book is the actual diary she wrote across her 9 years reviving Vanity Fair magazine. It's packed with 1980s media gossip, boldface-name encounters, and the office politics behind the editorial calls that turned the magazine around, giving you a genuinely rare firsthand look at the industry rather than a polished retrospective. Dishy and addictive if you're into media-world drama, less essential if you're not already curious about that world. A juicy time capsule of a very specific, very glamorous decade.", "cov": "/reads/covers/45194fd635.webp", "col": "#9d847b", "pt": {"y": true, "age": "Adult", "pop": 2.0, "pers": "Casual", "hook": "Plot"}, "insp": {"y": true, "by": "Underdog", "fmt": hen Katz for the ride. Their sheer incompetence carries most of the comedy, but Bryson weaves in genuinely interesting detours into the trail's natural history, small-town America, and the environmental politics of the wilderness they're bumbling through. You don't need to care even slightly about hiking to find this funny, that's kind of the whole point. A classic for a reason, and Katz alone is worth the price of admission.", "pt": {"y": false, "age": null, "pop": 4.0, "pers": "Casual"}, "insp": {"y": false, "by": null, "fmt": "Audiobook"}, "teach": {"y": true, "explore": "\ud83c\udf0e Our society", "facts": 1.0}, "cozy": {"y": true, "laugh": "Cackle", "fmt": "Audiobook", "sunday": "Laugh"}, "hw": {"y": false, "tissue": 2.0, "ctype": null, "emotion": null, "fmt": "Audiobook"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": false}, "cov": "/reads/covers/db62e3fbc2.webp"}, {"t": "Talking to Strangers: What We Should Know About the People We Don't Know", "a": "Malcolm Gladwell", "r": 4.0, "fav": false, "type": "Nonfic", "p": 388.0, "y": 2019.0, "rev": "Malcolm Gladwell sets out to explain why we're so reliably bad at reading people we don't know, building his case through espionage cases, wrongful arrests, and infamous historical misjudgments. His ideas about default truth-telling and mismatched communication styles are genuinely compelling, the kind of framework you can't stop applying to your own life after you close the book. As with a lot of Gladwell, it's less rigorous than it feels while you're reading it, and a couple of his real-world examples have aged into real controversy since publication. Worth reading anyway, if only to argue with it.", "pt": {"y": false, "age": null, "pop": 4.0, "pers": "Casual"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Audiobook"}, "teach": {"y": true, "explore": "\ud83c\udf0e Our society", "facts": 2.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Audiobook"}, "hw": {"y": false, "tissue": 2.0, "ctype": he best way, but there's real reporting and reckoning underneath the juicy anecdotes. Genuinely fun if you like tech-industry drama, and Swisher clearly still has receipts on everyone.", "pt": {"y": false, "age": null, "pop": 2.0, "pers": "Casual"}, "insp": {"y": false, "by": "N/A", "fmt": "Either"}, "teach": {"y": true, "explore": "\ud83c\udf0e Our society", "facts": 2.0}, "cozy": {"y": false, "laugh": "DryWit", "fmt": "Either"}, "hw": {"y": false, "tissue": 2.0, "ctype": null, "emotion": null, "fmt": "Either"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": false}, "cov": "/reads/covers/d81869f0c0.webp"}, {"t": "A Promised Land", "a": "Barack Obama", "r": 5.0, "fav": true, "type": "Memoir", "p": 701.0, "y": 2020.0, "rev": "Just hearing Obama's voice feels like time travel to a better time. This memoir of his early political career through the first years of his presidency is exactly the thoughtful, measured read you'd expect. Part history lesson, part genuine reflection. You'll time travel back to the 2008 financial crisis, the Affordable Care Act, the Arab Spring, Osama bin Laden. Nostalgic in a way that makes you yearn for 2010 like you wouldn't believe. It's a time commitment (29 hr listen) but I so enjoyed my long walks sinking deep into this listen.", "pt": {"y": true, "age": null, "pop": 5.0, "pers": "Insufferable", "hook": "Characters"}, "insp": {"y": true, "by": "Underdog", "fmt": "Audiobook ONLY"}, "teach": {"y": true, "explore": "\ud83c\udf0e Our society", "facts": 2.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Audiobook ONLY"}, "hw": {"y": false, "tissue": 3.0, "ctype": null, "emotion": null, "fmt": "Audiobook ONLY"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}, "cov": "/reads/covers/b0a3da001e.webp"}, {"t": "Bad Feminist", "a": "Roxane Gay", "r": 5.0, "fav": true, "type": "Memoir", "p": 320.0, "y": 2014.0, "rev": "Roxane Gay opens with the confession that she likes things feminism supposedly forbids her from liking, and then spends the whole collection making the case that contradiction doesn't disqualify you from the label. The essays range wildly, from reproductive rights and campus rape culture to competitive Scrabble and reality TV, and somehow it all coheres into an argument for a messier, more inclusive feminism than the purity-test version we usually get sold. Heads up that a couple of essays deal directly with sexual violence, handled with care but present. Gay is whip-smart and often laugh-out-loud funny, and she never once pretends to have it all figured out, which is exactly why this holds up. One of my favorites, read it and then immediately hand it to someone else.", "pt": {"y": true, "age": "Adult", "pop": 3.0, "pers": "Casual", "hook": "Characters"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Either"}, "teach": {"y": true, "explore": "\ud83e\udd70 Life as a woman", "facts": 2.0}, "cozy": {"y": false, "laugh": "DryWit", "fmt": "Either"}, "hw": {"y": false, "tissue": 3.0, "ctype": null, "emotion": null, "fmt": "Either"}, "fem": {"y": true, "night": "Coup", "real": true}, "wild": {"y": true}, "cov": "/reads/covers/113d800e60.webp"}, {"t": "Kitchen Confidential: Adventures in the Culinary Underbelly", "a": "Anthony Bourdain", "r": 4.0, "fav": false, "type": "Memoir", "p": 312.0, "y": 2000.0, "rev": "Anthony Bourdain blows up the polished image of restaurant life with a memoir that's as gleefully unhinged as his TV persona always suggested. He pulls back the curtain on decades in New York City kitchens, the drug use, the brutal hierarchies, the industry secrets no diner is supposed to know about, and tells it all with a swagger that somehow makes even the grim parts entertaining. It's funny, a little terrifying, and completely unfiltered about a world most of us only ever see from the dining room. You will never look at brunch, or your server, the same way again.", "pt": {"y": true, "age": "Teen", "pop": 4.0, "pers": "Casual", "hook": "Characters ncerity, refreshingly honest about the costs. My biggest critique: her self-deprecating \"I'm just a regular person\" humility does her disservice a legacy, and I genuinely want more ego out of her.", "cov": "/reads/covers/641b0efb6e.webp", "col": "#52522a", "pt": {"y": false, "age": null, "pop": 2.0, "pers": "Casual"}, "insp": {"y": true, "by": "MoldBreaker", "fmt": "Audiobook ONLY"}, "teach": {"y": false, "explore": null, "facts": null}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Audiobook ONLY"}, "hw": {"y": false, "tissue": 3.0, "ctype": null, "emotion": null, "fmt": "Audiobook ONLY"}, "fem": {"y": true, "night": "PowerSuits", "real": true}, "wild": {"y": false}}, {"t": "The Undoing Project: A Friendship That Changed Our Minds", "a": "Michael Lewis", "r": 3.5, "fav": false, "type": "Nonfic", "p": 368.0, "y": 2016.0, "rev": "This book is about the decades-long partnership between psychologists Amos Tversky and Daniel Kahneman, who wrote one of the best (text)books ever written, Thinking Fast and Slow. Though Michael Lewis oddly never actually mentions that book here, he instead traces the logic behind many of the insights and discoveries this unlikely pair made together that eventually led them to write it. He treats their friendship with the same narrative drive he'd give a heist crew, tracking how 2 wildly different personalities produced work that would eventually win Kahneman a Nobel Prize. You might need to be a bit of a behavioral econ nerd for this to fully land, but if you've ever been a Freakonomics reader or podcast listener, this one's for you. It makes a compelling case for how big ideas actually get made: by 2 people arguing in a room, not 1 genius alone.", "cov": "/reads/covers/eb46519382.webp", "col": "#95a1ae", "pt": {"y": false, "age": null, "pop": 3.0, "pers": "Casual"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Either"}, "teach": {"y": true, "explore": "\ud83c\udf0e Our society", "facts": 2.0}, "cozy": {"y": false, "laugh": "NoJok /* ---------------- quiz engine ---------------- */
let state = { mood:null, pool:[], answers:[] };
let history = [];
let userName = '';

/* ---------------- response logging (optional) ----------------
   If SUBMIT_URL is set to a Google Apps Script Web App URL, every completed
   quiz is logged as a row: timestamp, name, mood, full answer path, match.
   Left blank, this silently does nothing — safe to leave in. */
const SUBMIT_URL = "https://script.google.com/macros/s/AKfycbwlbjU0r0vU_dfzxABIaCsNctw_xW5_cabIGKiXf-pBKKzAKL3eebXtyflTGClR10sa/exec";

function logSubmission(book){
  if(!SUBMIT_URL) return;
  try{
    const moodLabel = (MOODS.find(m=>m.key===state.mood) || {}).label || state.mood || '';
    const payload = {
      name: userName || '(anonymous)',
      mood: moodLabel,
      answers: state.answers.map(a => `${a.text} → ${a.value}`).join(' | '),
      matchTitle: book.t || '',
      matchAuthor: book.a || '',
      timestamp: new Date().toISOString()
    };
    fetch(SUBMIT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
  }catch(err){ /* never let logging break the quiz */ }
}

function resetState(){
  state = { mood:null, pool:[], answers:[] };
  history = [];
}
resetState();

const qLabel = document.getElementById('qLabel');
const qText = document.getElementById('qText');
const optionsArea = document.getElementById('optionsArea');
const backBtn = document.getElementById('backBtn');
const stepCount = document.getElementById('stepCount');
const progressBar = document.getElementById('progressBar');
const progressWrap = document.querySelector('.progress');
const quizCard = document.getElementById('quizCard');
const nameStep = document.getElementById('nameStep');
const resultCard = document.getElementById('resultCard');
const resultBody = document.getElementById('resultBody');
const resultEyebrow = document.getElementById('resultEyebrow');
const pageHeader = document.getElementById('pageHeader');
const subtleBrand = document.getElementById('subtleBrand');
const revealFlash = document.getElementById('revealFlash');

function totalSteps(){
  return state.mood ? 1 + QUESTIONS[state.mood].length : 1;
}

function attr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function renderNameStep(){
  document.querySelector('.wrap').classList.add('landing');
  pageHeader.hidden = false;
  subtleBrand.hidden = true;
  progressWrap.hidden = true;
  quizCard.hidden = true;
  backBtn.hidden = true;
  stepCount.textContent = '';
  nameStep.innerHTML = `
    <div class="name-label">Who am I recommending to?</div>
    <div class="name-wrap">
      <input type="text" class="name-input" id="nameInput" placeholder="Your first name" maxlength="30" autofocus>
      <div class="name-go"><button class="btn-primary" id="nameGo">Here we go &rarr;</button></div>
    </div>
  `;
  const input = document.getElementById('nameInput');
  const submit = ()=>{
    const raw = input.value.trim();
    if(raw) userName = raw.charAt(0).toUpperCase() + raw.slice(1);
    progressWrap.hidden = false;
    quizCard.hidden = false;
    renderStep();
  };
  document.getElementById('nameGo').addEventListener('click', submit);
  input.addEventListener('keydown', e=>{ if(e.key === 'Enter') submit(); });
  input.focus();
}

function renderStep(){
  document.querySelector('.wrap').classList.remove('landing');
  quizCard.classList.remove('step-in'); void quizCard.offsetWidth; quizCard.classList.add('step-in');
  pageHeader.hidden = true;
  subtleBrand.hidden = false;
  const stepIdx = history.length;
  progressBar.style.width = Math.round((stepIdx/totalSteps())*100) + '%';
  stepCount.textContent = '';
  backBtn.hidden = stepIdx === 0;
  optionsArea.innerHTML = '';
  optionsArea.className = 'options';

  if(stepIdx === 0){
    qLabel.className = 'greeting';
    qLabel.textContent = userName
      ? `Hi ${userName}, sweet friend.`
      : "Hi, sweet friend.";
    qText.textContent = "First, let's start with a feeling. What are you craving right now in your read?";
    const list = document.createElement('ul');
    list.className = 'mood-list';
    MOODS.forEach(m=>{
      const li = document.createElement('li');
      const moodBtn = document.createElement('button');
      moodBtn.type = 'button';
      moodBtn.innerHTML = `
        <span class="left">${MOOD_ICON[m.key]}<span class="name">${m.label}</span></span>
        <span class="desc">${m.tag}<span class="arrow" aria-hidden="true">→</span></span>
      `;
      li.appendChild(moodBtn);
      moodBtn.onclick = ()=>{
        history.push({ mood:m.key });
        state.mood = m.key;
        state.pool = BOOKS.filter(b => b[m.key].y);
        state.answers = [];
        if(QUESTIONS[m.key].length === 0){ showResult(); } else { renderStep(); }
      };
      list.appendChild(li);
    });
    optionsArea.appendChild(list);
    return;
  }

  const qIdx = stepIdx - 1;
  const q = QUESTIONS[state.mood][qIdx];
  qLabel.className = 'q-label';
  qLabel.textContent = MOODS.find(m=>m.key===state.mood).label;
  qText.textContent = q.text;

  if(q.type === 'buttons'){
    const n = q.options.length;
    const useGrid = n === 4;
    const useRow = n <= 3;
    optionsArea.className = useGrid ? 'opt-grid' : (useRow ? 'opt-row' : 'options');
    q.options.forEach(o=>{
      const el = document.createElement('button');
      el.type = 'button';
      el.className = useGrid ? 'cell' : 'opt-btn';
      el.innerHTML = `<span class="opt-line">${o.label}${o.sub ? `: <span class="opt-line-sub">${o.sub}</span>` : ''}</span>`;
      el.onclick = ()=> answerQuestion(q, o.value);
      optionsArea.appendChild(el);
    });
  } else if(q.type === 'slider'){
    const wrap = document.createElement('div');
    wrap.className = 'slider-wrap';
    const mid = Math.round((q.min+q.max)/2);
    wrap.innerHTML = `
      <div class="slider-value" id="sliderVal">${mid}</div>
      <input type="range" id="sliderInput" min="${q.min}" max="${q.max}" value="${mid}" step="1">
      <div class="slider-labels"><span>${q.lowLabel}</span><span style="text-align:right">${q.highLabel}</span></div>
      <div class="slider-go"><button class="btn-primary" id="sliderGo">Next</button></div>
    `;
    optionsArea.appendChild(wrap);
    const input = document.getElementById('sliderInput');
    const val = document.getElementById('sliderVal');
    input.addEventListener('input', ()=>{ val.textContent = input.value; });
    document.getElementById('sliderGo').addEventListener('click', ()=> answerQuestion(q, parseInt(input.value,10)));
  }
}

function answerQuestion(q, value){
  const beforePool = state.pool;
  const filtered = q.apply(beforePool, value);
  const nextPool = filtered.length > 0 ? filtered : beforePool; // never narrow to zero
  history.push({ pool: beforePool, answer:{q, value} });
  state.answers.push({ text:q.text, value });
  state.pool = nextPool;

  const stepIdx = history.length;
  if(stepIdx - 1 >= QUESTIONS[state.mood].length){
    showResult();
  } else {
    renderStep();
  }
}

backBtn.addEventListener('click', ()=>{
  if(history.length === 0) return;
  const last = history.pop();
  if(last.mood !== undefined){
    state.mood = null; state.pool = []; state.answers = [];
  } else {
    state.pool = last.pool;
    state.answers.pop();
  }
  renderStep();
});

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

let lastPool = [];
let lastPoolIdx = 0;

function computeMatches(){
  // Favorites always lead, then descend by star rating (5 -> 4.5 -> 4 -> ...).
  // Books tie within the same favorite/rating tier are shuffled among themselves
  // so repeat plays still feel varied without breaking that priority order.
  const tiers = [];
  let currentTier = null;
  state.pool
    .slice()
    .sort((a, b) => {
      const favDiff = (a.fav ? 0 : 1) - (b.fav ? 0 : 1);
      if(favDiff !== 0) return favDiff;
      return (b.r||0) - (a.r||0);
    })
    .forEach(b => {
      const key = (b.fav ? 'fav' : 'nonfav') + ':' + (b.r||0);
      if(!currentTier || currentTier.key !== key){
        currentTier = { key, books:[] };
        tiers.push(currentTier);
      }
      currentTier.books.push(b);
    });
  const ordered = tiers.flatMap(t => shuffle(t.books));
  const top = ordered.slice(0, Math.max(8, Math.ceil(ordered.length*0.4)));
  return top;
}

function starRow(r){
  const STAR_PTS = "12 2 15 9 22 9 16.5 13.5 18.5 21 12 17 5.5 21 7.5 13.5 2 9 9 9";
  let s = '';
  const full = Math.round(r);
  for(let i=1;i<=5;i++){
    s += `<svg width="16" height="16" viewBox="0 0 24 24" fill="${i<=full?'var(--accent)':'none'}" stroke="var(--accent)" stroke-width="1.5"><polygon points="${STAR_PTS}"/></svg>`;
  }
  return s;
}

function moodPhrase(){
  const labels = {
    pt:"something so good you forget to check your phone",
    insp:"ambition, courage, and the extraordinary",
    teach:"to learn something new and true",
    cozy:"something light and comforting",
    hw:"to feel it, just a little",
    fem:"a little her-story energy",
    wild:"a total trust fall",
  };
  return labels[state.mood] || "something great";
}

const TYPE_LABEL = { Fiction:"Fiction", Nonfic:"Nonfiction", Memoir:"Memoir" };

function cleanReview(raw){
  return (raw || '').replace(/^\d+(\.\d+)?\s*stars?\s*--\s*/i, '').trim();
}

function addSparkles(container){
  if(!container) return;
  const spots = [
    { top:'-6px', left:'6%', delay:'0s' },
    { top:'12%', left:'-10px', delay:'.12s' },
    { top:'-4px', right:'2%', delay:'.24s' },
    { top:'55%', right:'-12px', delay:'.36s' },
    { bottom:'-8px', left:'38%', delay:'.48s' },
  ];
  spots.forEach(p=>{
    const s = document.createElement('span');
    s.className = 'sparkle';
    s.textContent = '✦';
    Object.assign(s.style, p);
    s.style.animationDelay = p.delay;
    container.appendChild(s);
  });
}

function renderResult(book){
  document.querySelector('.wrap').classList.remove('landing');
  const placeholderColor = book.col || MOOD_META[state.mood].color;
  const coverHtml = book.cov
    ? `<img class="result-cover" src="${book.cov}" alt="Cover of ${attr(book.t)}" decoding="async">`
    : `<div class="cover" style="background:${placeholderColor}">
        <div class="ct">${book.t}</div>
        <div class="ca">${book.a}</div>
      </div>`;
  resultEyebrow.innerHTML = '<span class="spark" aria-hidden="true">&#10022;</span> Your match';
  const safeName = escapeHtml(userName);
  const whyLine = userName
    ? `Somewhere on my shelf, this book was already waiting for you, ${safeName}.`
    : "Somewhere on my shelf, this book was already waiting for you.";

  const typeYear = [TYPE_LABEL[book.type] || book.type || '', book.y || ''].filter(Boolean).join(' &middot; ');
  const grUrl = `https://www.goodreads.com/search?q=${encodeURIComponent(book.t + ' ' + book.a)}`;
  const review = cleanReview(book.rev) || "I haven't written this one up yet, but it earned a spot on my shelf, which is recommendation enough.";

  resultBody.innerHTML = `
    <div class="cover-frame">
      ${coverHtml}
      <span class="cover-spark" aria-hidden="true">&#10022;</span>
    </div>
    <div class="result-title">${book.t}</div>
    <div class="result-author">${book.a}</div>
    <div class="result-typeyear">${typeYear}${typeYear ? ' &middot; ' : ''}<a class="result-link" href="${grUrl}" target="_blank" rel="noopener">Goodreads &rarr;</a></div>
    <p class="result-why">${whyLine}</p>
    <div class="result-review-label">Why I think you'll love it</div>
    <div class="result-review">${review}</div>
  `;
  addSparkles(resultBody.querySelector('.cover-frame'));

  pageHeader.hidden = true;
  subtleBrand.hidden = false;
  quizCard.hidden = true;
  document.querySelector('.progress').hidden = true;
  resultCard.hidden = false;

  resultCard.classList.remove('reveal');
  void resultCard.offsetWidth; // restart animation each time
  resultCard.classList.add('reveal');
  fitResult();
}

function fitResult(){
  const rv = document.querySelector('.result-review');
  if(!rv || resultCard.hidden) return;
  rv.style.fontSize = '';
  if(window.innerWidth > 640) return;
  const wrapEl = document.querySelector('.wrap');
  let size = 14.5;
  rv.style.fontSize = size + 'px';
  while(wrapEl.offsetHeight > window.innerHeight && size > 11.5){
    size -= 0.5;
    rv.style.fontSize = size + 'px';
  }
}
window.addEventListener('resize', fitResult);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitResult);

function showResult(){
  lastPool = computeMatches();
  lastPoolIdx = 0;
  revealFlash.hidden = false;
  revealFlash.classList.remove('fade');
  void revealFlash.offsetWidth;
  renderResult(lastPool[0]);
  logSubmission(lastPool[0]);
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{ revealFlash.classList.add('fade'); });
  });
  setTimeout(()=>{ revealFlash.hidden = true; }, 850);
}

document.getElementById('anotherBtn').addEventListener('click', ()=>{
  lastPoolIdx = (lastPoolIdx + 1) % lastPool.length;
  renderResult(lastPool[lastPoolIdx]);
});
document.getElementById('restartBtn').addEventListener('click', ()=>{
  resetState();
  resultCard.hidden = true;
  quizCard.hidden = false;
  document.querySelector('.progress').hidden = false;
  renderStep();
});

renderNameStep();
</script>
