<style>

  :root {
    --bg: #F7F0E6; --bg-2: #EEE0CC; --surface: #F7F0E6; --surface-2: #F1DFCF;
    --text: #2B2019; --text-muted: #6B5847; --text-faint: #7D6A58; --border: #DCC6AF;
    --accent: #AC4E33; --accent-soft: #F1DFCF; --accent-text: #F7F0E6;
    --shadow: rgba(43,32,25,0.14);
    --coral-deep: #7F3A26;
    --hairline: #DCC6AF;
  }
  :root[data-theme="light"] {
    --bg: #F7F0E6; --bg-2: #EEE0CC; --surface: #F7F0E6; --surface-2: #F1DFCF;
    --text: #2B2019; --text-muted: #6B5847; --text-faint: #7D6A58; --border: #DCC6AF;
    --accent: #AC4E33; --accent-soft: #F1DFCF; --accent-text: #F7F0E6;
    --shadow: rgba(43,32,25,0.14);
    --coral-deep: #7F3A26;
    --hairline: #DCC6AF;
  }

  * { box-sizing: border-box; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .opt-grid .cell:focus-visible, .opt-btn:focus-visible, .mood-list button:focus-visible{ outline-offset:-2px; }
  @keyframes stepIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .step-in{ animation: stepIn .25s ease both; }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation:none !important; transition:none !important; scroll-behavior:auto !important; }
  }
  body {
    background-color: var(--bg);
    color: var(--text); font-family: 'Newsreader', Georgia, serif; line-height: 1.55;
  }
  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; text-wrap: balance; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 24px 70px; }

  .subtle-brand{display:flex; align-items:center; gap:6px; margin-bottom:32px;}
  .subtle-brand svg{color:var(--text-faint); flex:none;}
  .subtle-brand span{font-family:'Fraunces', Georgia, serif; font-style:italic; font-size:12px; color:var(--text-faint); letter-spacing:.02em;}

  header { margin-bottom: 34px; }

  .site-id{display:flex; flex-wrap:wrap; row-gap:2px; align-items:baseline; gap:8px; color:var(--accent); margin-bottom:38px;}
  .wordmark{font-family:'Fraunces',serif; font-style:italic; font-weight:600; font-size:15px;}
  .site-id .divider{color:var(--text-faint); font-size:11px;}
  .site-id .companion{font-family:'Newsreader',serif; font-size:11.5px; color:var(--text-faint); font-style:italic;}

  .landing-grid{display:grid; grid-template-columns:1.15fr .85fr; gap:20px; align-items:end;}
  .big-headline{font-size:clamp(36px,5.4vw,50px); line-height:1.02; margin-bottom:22px;}
  .big-headline .line1{display:block; font-style:italic; font-weight:600; color:var(--coral-deep, #7F3A26); position:relative;}
  .big-headline .line1 .dw{position:relative;}
  .big-headline .line1 .dw svg{position:absolute; left:0; bottom:-9px; width:100%; height:11px;}
  .big-headline .line2{display:block; font-weight:500; color:var(--text); font-size:.7em; margin-top:6px;}
  header p.lede{font-size:15px; line-height:1.62; color:var(--text-muted); max-width:40ch;}

  .book-stack{position:relative; width:183px; max-width:183px; height:206px; margin:0 0 0 auto;}
  .book-stack::after{content:'';position:absolute;left:-4px;right:-4px;bottom:-1px;height:1px;background:var(--border);}
  .book-stack .b{position:absolute; bottom:1px; border-radius:1px; box-shadow:3px 6px 14px var(--shadow);}
  .book-stack .b::after{content:'';position:absolute;top:16px;left:8px;right:8px;height:1px;background:rgba(0,0,0,.15);}
  .book-stack .b1{left:2px; width:46px; height:150px; background:var(--bg-2); transform:rotate(-7deg);}
  .book-stack .b2{left:44px; width:50px; height:182px; background:var(--accent); transform:rotate(-1deg); z-index:2;}
  .book-stack .b3{left:92px; width:44px; height:132px; background:var(--text); transform:rotate(5deg);}
  .book-stack .b4{left:128px; width:48px; height:164px; background:var(--surface-2); border:1px solid var(--border); transform:rotate(10deg); box-shadow:none;}

  @media (max-width:820px){
    .landing-grid{grid-template-columns:1fr; gap:36px;}
    .book-stack{margin:0 auto;}
  }

  .progress{height:2px; border-radius:0; background:var(--border); overflow: hidden; margin-bottom: 26px;}
  .progress-bar{height:100%; background:var(--accent); border-radius:0; transition: width .3s ease; width: 0%;}

  .quiz-card { background:none; border:none; border-radius:0; box-shadow:none; padding:0; max-width:600px; }
  .q-text, #qText{ font-family:'Fraunces',serif; font-size:21px; font-weight:600; line-height:1.3; margin:0 0 24px; }
  .q-label{ font-family:'Newsreader',serif; font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:10px; }
  .greeting{ display:block; font-family:'Newsreader',serif; font-size:15px; font-style:italic; color:var(--text-muted); margin-bottom:10px; }
  .options { display: flex; flex-direction: column; }
  .opt-btn{
    text-align:left; background:none; border:none; border-bottom:1px solid var(--border);
    color:var(--text); border-radius:0; padding:16px 4px; font-family:'Newsreader',serif; font-size:15.5px;
    cursor:pointer; transition:background .15s, color .15s;
  }
  .opt-btn:hover{ background:var(--surface-2); color:var(--coral-deep, #7F3A26); }
  .opt-line{ line-height:1.4; }
  .opt-line-sub{ color:var(--text-muted); }

  .opt-grid{
    display:grid; grid-template-columns:1fr 1fr;
    border-top:1px solid var(--border); border-left:1px solid var(--border);
  }
  .opt-grid .cell{
    background:none; border:0; color:inherit; text-align:left; width:100%;
    border-right:1px solid var(--border); border-bottom:1px solid var(--border);
    padding:26px 22px; min-height:132px; display:flex; align-items:center;
    cursor:pointer; transition:background .15s; font-size:15.5px; line-height:1.4; font-family:'Newsreader',serif;
  }
  .opt-grid .cell:hover{ background:var(--surface-2); color:var(--coral-deep, #7F3A26); }
  @media (max-width:420px){ .opt-grid{grid-template-columns:1fr;} .opt-grid .cell{min-height:auto;} }

  .opt-row{
    display:flex;
    border-top:1px solid var(--border); border-left:1px solid var(--border);
  }
  .opt-row .opt-btn{
    flex:1; border-right:1px solid var(--border); padding:20px 16px;
  }
  @media (max-width: 640px) {
    .opt-row { flex-direction: column; }
    .opt-row .opt-btn { border-right: none; }
  }

  .mood-list{list-style:none; margin:0; padding:0;}
  .mood-list li{ border-bottom:1px solid var(--border); }
  .mood-list button{
    display:flex; justify-content:space-between; align-items:center; gap:16px; width:100%;
    padding:16px 0; min-height:70px; background:none; border:0; font:inherit; color:inherit;
    text-align:left; cursor:pointer;
  }
  .mood-list li:first-child button{padding-top:0;}
  .mood-list .left{display:flex; align-items:center; gap:12px; flex:none;}
  .mood-list .left svg{width:18px; height:18px; color:var(--text-faint); flex:none; transition:color .15s;}
  .mood-list .name{font-size:19px; font-family:'Fraunces',serif; font-weight:500;}
  .mood-list .desc{
    font-size:13px; font-style:italic; color:var(--text-muted); line-height:1.4;
    text-align:right; flex:0 1 auto; min-width:0; display:flex; align-items:center; gap:8px; justify-content:flex-end;
  }
  .mood-list .arrow{color:var(--text-faint); opacity:.45; transition:opacity .15s, color .15s;}
  .mood-list button:hover .arrow, .mood-list button:focus-visible .arrow{opacity:1; color:var(--accent);}
  .mood-list button:hover .name, .mood-list button:focus-visible .name{color:var(--coral-deep, #7F3A26);}
  .mood-list button:hover .left svg, .mood-list button:focus-visible .left svg{color:var(--accent);}

  .slider-wrap { padding: 10px 4px 4px; }
  .slider-labels { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
  .slider-labels span { max-width: 45%; }
  input[type=range]{
    width:100%; accent-color:var(--accent); height:1px; background:var(--border); margin:14px 0 22px;
  }
  .slider-value{ text-align:center; font-family:'Fraunces',serif; font-style:italic; font-weight:600; font-size:1.8rem; margin-bottom:14px; color:var(--accent); }
  .slider-go { display:flex; justify-content:center; }

  .name-step{ margin-top: 28px; }
  .name-label{ font-family:'Newsreader',serif; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); margin-bottom: 12px; }
  .name-wrap { padding: 0; }
  .name-input{
    width:100%; max-width:280px; border:none; border-bottom:1px solid var(--text-faint); background:transparent;
    font-family:'Newsreader',serif; font-style:italic; font-size:18px; color:var(--text);
    padding:6px 2px 10px; border-radius:0; margin-bottom: 16px; display:block;
  }
  .name-input:focus { outline: none; border-color: var(--accent); }
  .name-input::placeholder{color:var(--text-faint); opacity:.85;}
  .name-go { display:flex; justify-content:flex-start; }

  .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; }
  .back-btn { background: none; border: none; color: var(--text-muted); font-size: 13.5px; cursor: pointer; font-family: 'Newsreader', serif; padding: 12px 10px; margin-left:-10px; min-height:44px; }
  .back-btn:hover { color: var(--text); }
  .back-btn[hidden] { visibility: hidden; }
  .step-count { font-size: 12.5px; color: var(--text-faint); }

  .result-card{ background:none; border:none; box-shadow:none; padding:0; text-align:left; max-width:600px; }
  .result-eyebrow{
    display:flex; align-items:center; gap:8px; font-family:'Newsreader',serif; font-weight:600;
    letter-spacing:.14em; text-transform:uppercase; color: var(--accent); font-size: 13px; margin-bottom: 28px;
  }
  .result-eyebrow .spark{ font-size:15px; }
  .cover-frame{ position:relative; float:left; margin:0 22px 14px 0; }
  .result-cover{ width:150px; aspect-ratio:2 / 3; object-fit:cover; background:var(--surface-2); border-radius:0; box-shadow:3px 6px 14px var(--shadow); display:block; }
  .cover{
    width:150px; height:220px; color:var(--bg); display:flex; flex-direction:column; justify-content:space-between;
    padding:22px 16px 16px; font-family:'Fraunces',serif; box-shadow:3px 6px 14px var(--shadow);
  }
  .cover .ct{ font-size:16px; font-style:italic; line-height:1.2; }
  .cover .ca{ font-size:10px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; margin-top:8px; }
  .cover-spark{ position:absolute; top:-10px; right:-10px; color:var(--accent); font-size:22px; line-height:1; }
  .result-title { font-family:'Fraunces',serif; font-size: 26px; font-style:italic; font-weight: 500; margin: 0 0 8px; line-height: 1.22; }
  .result-author { font-size:12px; letter-spacing:.1em; text-transform:uppercase; color: var(--text-muted); margin-bottom: 12px; }
  .result-typeyear{ color: var(--text-faint); font-size: 13px; margin-bottom: 8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .result-link { color: var(--coral-deep, #7F3A26); font-size: 13px; text-decoration: none; border-bottom:1px solid var(--surface-2); }
  .result-link:hover { text-decoration: underline; }
  @media (max-width: 480px) {
    .cover-frame{ margin:0 16px 14px 0; }
    .result-cover, .cover { width: 92px; }
    .cover { height: 134px; padding:20px 10px 12px; }
    .cover .ct{ font-size:12px; }
    .cover .ca{ font-size:8px; }
    .result-title{ font-size:20px; margin-bottom:6px; }
    .result-author{ font-size:10.5px; margin-bottom:8px; }
    .result-typeyear{ font-size:11.5px; margin-bottom:6px; }
  }
  .result-why { display:none; }
  .result-review-label{ clear:both; font-family:'Newsreader',serif; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); margin:28px 0 10px; }
  .result-review{
    clear:both; text-align:left; font-size:16px; line-height:1.58; color:var(--text); background:none;
    border-radius:0; border-left:3px solid var(--accent-soft); padding:0 0 0 20px; margin:0; font-style:italic;
    max-height:none; overflow:visible;
  }
  .result-actions{ display:flex; gap:22px; align-items:center; margin-top:28px; padding-top:20px; border-top:1px solid var(--border); clear:both; }
  .action-primary{ background:none; border:none; padding:0; font-family:'Newsreader',serif; font-size:14px; color:var(--coral-deep, #7F3A26); text-decoration:none; font-weight:500; cursor:pointer; }
  .action-secondary{ background:none; border:none; padding:0; font-family:'Newsreader',serif; font-size:12.5px; color:var(--text-faint); text-decoration:underline; text-decoration-color:var(--border); cursor:pointer; }
  @media (max-width:640px){
    .result-actions{ flex-direction:column; align-items:stretch; gap:4px; }
    .action-primary{ background:var(--coral-deep, #7F3A26); color:var(--bg); padding:15px 20px; border-radius:2px; font-size:15px; text-align:center; }
    .action-secondary{ padding:14px; text-align:center; font-size:13.5px; }
  }

  .reveal-flash { position: fixed; inset: 0; background: var(--bg); z-index: 999; opacity: 1; pointer-events: none; transition: opacity .8s ease; }
  .reveal-flash.fade { opacity: 0; }
  @keyframes resultPop {
    0% { opacity: 0; transform: scale(0.92) translateY(16px); }
    65% { opacity: 1; transform: scale(1.015) translateY(-2px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  .result-card.reveal { animation: resultPop .65s cubic-bezier(.22,.8,.32,1) both; }
  .sparkle {
    position: absolute; pointer-events: none; font-size: 1.05rem; opacity: 0; color: var(--accent);
    animation: sparkleFade 1.3s ease forwards;
  }
  @keyframes sparkleFade {
    0% { opacity: 0; transform: scale(.3) rotate(-10deg); }
    35% { opacity: 1; transform: scale(1.2) rotate(10deg); }
    100% { opacity: 0; transform: scale(.85) rotate(20deg) translateY(-16px); }
  }
  .btn-primary{
    display:inline-flex; align-items:center; gap:9px;
    background:var(--coral-deep, #7F3A26); color:var(--bg);
    font-family:'Newsreader',serif; font-size:14.5px; letter-spacing:.03em;
    padding:11px 20px; border:none; border-radius:2px; cursor:pointer;
  }
  .btn-primary:hover{ opacity:.92; }

  .wrap{ min-height:100dvh; display:flex; flex-direction:column; }
  footer{ margin-top:auto; padding-top:40px; text-align:left; color:var(--text-faint); font-size:12.5px; }
  footer a{ color:var(--text-muted); }

  /* ---- compact phone layout: every screen should fit without scrolling ---- */
  @media (max-width:640px){
    .wrap{ padding:12px 30px 14px; }
    .subtle-brand{ margin-bottom:10px; }
    .progress{ margin-bottom:12px; }

    .name-label{ font-size:12px; }
    .name-go .btn-primary{ width:100%; justify-content:center; padding:14px 20px; font-size:16px; border-radius:4px; }
    .wrap.landing header{ flex:1; display:flex; flex-direction:column; }
    .wrap.landing .landing-grid{ flex:1; align-content:center; }

    .opt-btn{ padding:13px 4px; }
    .opt-row .opt-btn{ padding:13px 12px; }
    .opt-grid .cell{ padding:14px 14px; }
    .nav-row{ margin-top:6px; }
    .back-btn{ padding:10px 10px; min-height:40px; }

    .result-eyebrow{ margin-bottom:12px; font-size:12px; }
    .cover-frame{ margin:0 14px 6px 0; }
    .result-cover, .cover{ width:88px; }
    .cover{ height:130px; padding:20px 9px 10px; }
    .cover .ct{ font-size:11px; }
    .cover .ca{ font-size:7.5px; }
    .cover-spark{ font-size:16px; top:-7px; right:-7px; }
    .result-title{ font-size:19px; margin-bottom:4px; }
    .result-author{ font-size:10px; margin-bottom:6px; }
    .result-typeyear{ font-size:11.5px; margin-bottom:0; }
    .result-review-label{ margin:12px 0 6px; font-size:10.5px; }
    .result-review{ font-size:14px; line-height:1.45; padding-left:14px; border-left-width:2px; }
    .result-actions{ flex-direction:row; align-items:center; gap:10px; margin-top:14px; padding-top:12px; }
    .action-primary{ flex:1; padding:12px 14px; font-size:14px; }
    .action-secondary{ padding:12px 6px; font-size:13px; }
  }
  @media (max-width:640px) and (max-height:720px){
    .book-stack{ zoom:.8; }
    .name-input{ margin-bottom:22px; }
    .big-headline{ font-size:38px; margin-bottom:10px; }
    header p.lede{ font-size:14px; }
  }

  @media (min-width:641px) and (max-width:899px){ .wrap{ padding-left:44px; padding-right:44px; } }
  /* ---- wide-screen homepage ---- */
  .foot-site{ display:none; }
  @media (min-width:900px){
    .wrap.landing{ max-width:1240px; padding:52px 64px 34px; }
    .wrap.landing header{ flex:1; display:flex; flex-direction:column; margin-bottom:0; }
    .wrap.landing .site-id{ margin-bottom:0; }
    .wrap.landing .wordmark{ font-size:24px; }
    .wrap.landing .site-id .companion{ font-size:16px; }
    .wrap.landing .landing-grid{ flex:1; grid-template-columns:minmax(0,1fr) clamp(300px,46%,532px); gap:clamp(40px,6.67vw,96px); align-items:center; padding:36px 0 44px; }
    .wrap.landing .landing-grid > div:first-child{ padding-bottom:60px; }
    .wrap.landing .big-headline{ font-size:80px; line-height:1; margin-bottom:34px; }

    .wrap.landing .name-step{ margin-top:44px; }
    .wrap.landing .name-label{ font-size:13px; letter-spacing:.16em; margin-bottom:14px; }
    .wrap.landing .name-wrap{ display:flex; align-items:flex-end; gap:20px; }
    .wrap.landing .name-input{ flex:1 1 200px; width:auto; max-width:302px; min-width:0; margin-bottom:0; font-size:26px; border-bottom:2px solid var(--accent); padding:4px 2px 10px; }

    .wrap.landing .stack-col{
      height:clamp(360px, 62vh, 560px);

    }

    .wrap.landing .book-stack::after{ left:-26px; right:-26px; bottom:-6px; height:6px; background:#DCCDB6; }

y (see: the daily Balthazar memo). This memoir wildly defies the norm of \"I made mistakes, I learned, I'm better now.\" He shares his incredible success but also just sits, self-aware, in his own deep flaws. That honesty is rare, and it comes after a 2016 stroke that left him partially paralyzed, followed two years later by a suicide attempt during his recovery. Writing about both without reaching for sympathy, and simply owning his flaws, isn't easy. If you like your memoirs messy, with a side of restaurant-world gossip, this is your pick.", "cov": "/reads/covers/a944b9f29e.webp", "col": "#746a6a", "pt": {"y": true, "age": "Adult", "pop": 2.0, "pers": "Casual", "hook": "Characters"}, "insp": {"y": false, "by": "N/A", "fmt": "Audiobook"}, "teach": {"y": false, "explore": null, "facts": null}, "cozy": {"y": false, "laugh": "DryWit", "fmt": "Audiobook"}, "hw": {"y": true, "tissue": 4.0, "ctype": "Hard truth about the world", "emotion": "Reckoning", "fmt": "Audiobook"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}}, {"t": "I'm Glad My Mom Died", "a": "Jennette McCurdy", "r": 4.0, "fav": false, "type": "Memoir", "p": 320.0, "y": 2022.0, "rev": "That title alone is designed to make you flinch before you crack the spine, and Jennette McCurdy earns every bit of the discomfort. She writes about growing up as a controlled child star on iCarly under a mother who monitored her body, her diet, and nearly every choice she made, and she does it with a dark humor that somehow makes the genuinely disturbing parts easier to sit with. Real content warnings around eating disorders and parental control apply throughout, so go in prepared. It's unflinching, oddly funny, and somehow both a gut punch and a good time.", "pt": {"y": true, "age": "Adult", "pop": 5.0, "pers": "Casual", "hook": "Characters"}, "insp": {"y": false, "by": null, "fmt": "Either"}, "teach": {"y": false, "explore": null, "facts": null}, "cozy": {"y": false, "laugh": "DryWit", "fmt": "Either" ame, sharing her story of the assault, and the aftermath, including the media firestorm. I expected it to be powerful and moving, but I was not prepared for what an absolutely astouding writer she is: cutting but accessible, poetic yet never too much. Her words carried such weight, I had a full-body experience reading this book: chills, gasps, heartache, tears. Her words make you feel rage, peace, shock, proud to be a woman, and every emotion in between. I cannot possibly say more positive things about this book: it is the book to teach us all about sexual assault.", "pt": {"y": true, "age": "Adult", "pop": 4.0, "pers": "Insufferable", "hook": "Prose"}, "insp": {"y": true, "by": "Underdog", "fmt": "Audiobook ONLY"}, "teach": {"y": true, "explore": "\ud83e\udd70 Life as a woman", "facts": 1.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Audiobook ONLY"}, "hw": {"y": true, "tissue": 9.0, "ctype": "Hard truth about the world", "emotion": "Reckoning", "fmt": "Audiobook ONLY"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}, "cov": "/reads/covers/d3da6f67eb.webp"}, {"t": "Martyr!", "a": "Kaveh Akbar", "r": 4.5, "fav": true, "type": "Fiction", "p": 332.0, "y": 2024.0, "rev": "Cyrus Shams is a young Iranian American poet newly sober and hunting for some kind of meaning in his mother's death aboard Iran Air Flight 655 back in 1988. That search leads him somewhere genuinely strange: a living art installation at the Brooklyn Museum featuring a terminally ill artist, which cracks open everything Cyrus thought he understood about martyrdom and sacrifice. Kaveh Akbar is funny and devastating often in the same sentence, and the structure, weaving in fragments from Cyrus's father, uncle, and mother, shouldn't work as well as it does. One of my favorites this year, and proof that grief books don't have to be predictable.", "cov": "/reads/covers/820755b26c.webp", "col": "#b68800", "pt": {"y": true, "age": "Adult", "pop": 2.0, "pers": "Casual", "hook": "P ents from. Celeste Ng is so good at showing how privilege quietly decides who gets believed and who doesn't, and everything builds toward the fire that eventually burns the Richardson house down. It's a satisfying, morally complicated read that never lets anyone off the hook completely. Great for anyone who likes their fiction with a side of righteous anger.", "pt": {"y": true, "age": "Teen", "pop": 5.0, "pers": "Casual", "hook": "Plot + Characters"}, "insp": {"y": false, "by": "N/A", "fmt": "Either"}, "teach": {"y": false, "explore": null, "facts": null}, "cozy": {"y": true, "laugh": "DryWit", "fmt": "Either", "sunday": "Catchup"}, "hw": {"y": true, "tissue": 6.0, "ctype": "Complicated relationships", "emotion": "Reckoning", "fmt": "Either"}, "fem": {"y": true, "night": "TraumaBonds", "real": false}, "wild": {"y": false}, "cov": "/reads/covers/8969a00c92.webp"}, {"t": "Maybe You Should Talk to Someone: A Therapist, Her Therapist, and Our Lives Revealed", "a": "Lori Gottlieb", "r": 5.0, "fav": true, "type": "Memoir", "p": 415.0, "y": 2019.0, "rev": "\"If we create the space and put in the time, we stumble upon stories that are worth waiting for, the ones that define our lives.\" Lori Gottlieb is a therapist who gets blindsided by a devastating breakup and ends up in therapy herself, and the book weaves together her stories with her therapist along with her stories of a handful of her patients. Similar to Esther Perel or Orna Guralnik's work, it gives you that unusually honest, behind-the-scenes look into other people's therapy sessions. You watch how the therapists aren't there to tell patients what to do but help them see their patterns, and Gottlieb is surprisngly candid, even when her patients frustrate her. Therapy isn't known for it's lighty topics but I did cry big tears finishing this one while sightseeing in Rome, so plan accordingly.", "pt": {"y": true, "age": "Adult", "pop": 4.0, "pers": "Insufferable", "hook": "Plot"}, "insp": {"y": true, "by": "MindsetSh : "/reads/covers/1f22d445c3.webp"}, {"t": "Anita de Monte Laughs Last", "a": "X\u00f3chitl Gonz\u00e1lez", "r": 4.0, "fav": false, "type": "Fiction", "p": 342.0, "y": 2024.0, "rev": "Anita de Monte is a Cuban American artist whose career and marriage to a famous older sculptor are falling apart in 1980s New York, loosely inspired by the real, still-unresolved death of artist Ana Mendieta. Decades later in 1998, working-class college student Raquel Toro becomes obsessed with Anita's forgotten life and mysterious death, and the two women's stories start mirroring each other in ways that sneak up on you. Xochitl Gonzalez is sharp on how the art world erases women of color, even if the pacing between the 2 timelines gets a little uneven. The ending lands hard enough to make up for it.", "cov": "/reads/covers/c7d3edde61.webp", "col": "#e80b02", "pt": {"y": true, "age": "Teen", "pop": 2.0, "pers": "Casual", "hook": "Plot + Characters"}, "insp": {"y": false, "by": "N/A", "fmt": "Book"}, "teach": {"y": false, "explore": null, "facts": null}, "cozy": {"y": false, "laugh": "DryWit", "fmt": "Book"}, "hw": {"y": true, "tissue": 6.0, "ctype": "Someone's story", "emotion": "Reckoning", "fmt": "Book"}, "fem": {"y": true, "night": "Coup", "real": false}, "wild": {"y": false}}, {"t": "Educated", "a": "Tara Westover", "r": 5.0, "fav": true, "type": "Memoir", "p": 352.0, "y": 2018.0, "rev": "This is on everyone's read or TBR list for very good reason. Tara Westover is exceptionally impressive, with levels of grit I did not know were possible. I listened to this on audio not long after it came out, and for a good chunk of it, I genuinely thought it was fiction until I realized this was an actual person's life story. Tara didn't have a birth certificate until she was 9, raised by survivalist Mormon parents in rural Idaho who kept her and her siblings entirely out of school, and she eventually teaches herself enough to get into BYU, then Cambridge, then Harvard. Extremely inspiring and haunting, we should all be grateful she shares her story this openly.", "pt": {"y": true, "age": "Adult", "pop": 5.0, "pers": "Insufferable", "hook": "Plot"}, "insp": {"y": true, "by": "Underdog", "fmt": "Audiobook"}, "teach": {"y": false, "explore": null, "facts": null}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Audiobook"}, "hw": {"y": true, "tissue": 8.0, "ctype": "Hard truth about the world", "emotion": "Reckoning", "fmt": "Audiobook"}, "fem": {"y": true, "night": "TraumaBonds", "real": true}, "wild": {"y": true}, "cov": "/reads/covers/5f3c248a8f.webp"}, {"t": "Finding Me", "a": "Viola Davis", "r": 5.0, "fav": true, "type": "Memoir", "p": 304.0, "y": 2022.0, "rev": "Viola Davis deserves all the flowers, and then all the rest. I admire her the same way I do Dolly Parton, obviously in awe of her talent, but more in awe of her character. Viola grew up in abject poverty in Rhode Island, the kind that's hard to wrap your head around, where hunger, racism, and domestic violence were daily facts of her life. Her whole family slept in one bedroom, and she wore the same one outfit every day, one that smelled like pee. But she had one lucky break: a teacher who saw her potential and changed the course of her life. Her story is the definition of inspiration and endless grit. What a beautiful, shining light she is, and what a honor it is to hear her story in her own words. It's a must-listen: she narrates the audiobook herself, a true masterclass from start to finish.", "pt": {"y": true, "age": "Adult", "pop": 4.0, "pers": "Insufferable", "hook": "Plot"}, "insp": {"y": true, "by": "Underdog", "fmt": "Audiobook ONLY"}, "teach": {"y": false, "explore": null, "facts": null}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Audiobook ONLY"}, "hw": {"y": true, "tissue": 8.0, "ctype": "Hard truth about the world", "emotion": "Reckoning", "fmt": "Audiobook ONLY"}, "fem": {"y": true, "night": "PowerSuits", "real": true}, "wild": {"y": true}, "cov": "/reads/covers/5025375225.w Ocean Vuong", "r": 5.0, "fav": true, "type": "Fiction", "p": 402.0, "y": 2025.0, "rev": "\"Ocean Vuong try not to make me cry\" challenge level: impossible. I'm endlessly astounded by how he captures the ache, the joy, and the sheer mundanity of being human, all at once, as melancholic and raw as it is beautiful. It's almost hard to believe English isn't his first language, the man was simply born to write. In his latest book, we follow Hai, a 19-year-old in crisis, and Grazina, an 82-year-old woman with dementia who intervenes at just the right time. He becomes her unlikely live-in caretaker, and these two people living on the fringes of society are one just what the other needed. It's not a redemption arc, it's a holding-on arc, a trying-anyway arc. Vuong does the thing he always does: finds grace in working-class struggle without ever getting sentimental about it. Content note for suicidal crisis and addiction. One of my favorites of all time, absolutely no contest, please read it and text me all your thoughts and feels.", "cov": "/reads/covers/0ec6543876.webp", "col": "#5d2b00", "pt": {"y": true, "age": "Adult", "pop": 4.0, "pers": "Insufferable", "hook": "Prose + Characters"}, "insp": {"y": false, "by": "N/A", "fmt": "Book"}, "teach": {"y": false, "explore": null, "facts": null}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Book"}, "hw": {"y": true, "tissue": 8.0, "ctype": "Complicated relationships", "emotion": "Tender", "fmt": "Book"}, "fem": {"y": false, "night": null, "real": false}, "wild": {"y": true}}, {"t": "The Perks of Being a Wallflower", "a": "Stephen Chbosky", "r": 5.0, "fav": true, "type": "Fiction", "p": 213.0, "y": 1999.0, "rev": "I came to this one very late, but I finally read it one day home sick, and maybe it was the flu but this book had such mom-brings-you-soup-in-bed kind of comfort. Charlie writes letters to an anonymous stranger about his freshman year in early-90s Pittsburgh, and seniors Sam and Patrick pull him into a world of mix ull year. That includes public speaking, talk show appearances, and confronting her own body image head-on, and watching a self-described workaholic introvert get dragged into the spotlight is both funny and oddly relatable. It's honest about how uncomfortable real change actually feels, not just the highlight-reel version. A solid pep talk in book form.", "pt": {"y": true, "age": "Teen", "pop": 3.0, "pers": "Casual", "hook": "Characters"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Audiobook ONLY"}, "teach": {"y": false, "explore": null, "facts": null}, "cozy": {"y": false, "laugh": "DryWit", "fmt": "Audiobook ONLY"}, "hw": {"y": false, "tissue": 3.0, "ctype": "Hard truth about the world", "emotion": null, "fmt": "Audiobook ONLY"}, "fem": {"y": true, "night": "PowerSuits", "real": true}, "wild": {"y": false}, "cov": "/reads/covers/751ff46967.webp"}, {"t": "No One Tells You This", "a": "Glynnis MacNicol", "r": 3.5, "fav": false, "type": "Memoir", "p": 294.0, "y": 2018.0, "rev": "Glynnis MacNicol turns 40 single and without kids, and instead of writing the apology memoir everyone expects from that premise, she writes the opposite. Prompted by her mother's declining health and a friend's pregnancy, she spends a year examining the independent, unconventional life she's actually built around her career and friendships, and refuses to perform sadness about it. It's refreshingly honest about the parts of that independence nobody warns you are actually great, the freedom, the travel, the friendships that function like family. A candid case for defining a meaningful life on your own terms.", "pt": {"y": true, "age": "Adult", "pop": 1.0, "pers": "Casual", "hook": "Characters"}, "insp": {"y": false, "by": "MindsetShift", "fmt": "Either"}, "teach": {"y": false, "explore": null, "facts": null}, "cozy": {"y": true, "laugh": "DryWit", "fmt": "Either", "sunday": "Catchup"}, "hw": {"y": false, "tissue": 4.0, "ctype": "Hard truth about the world", "emotion": null, "fmt": "Eit id enough to make you rethink everything you assumed about network news.", "pt": {"y": true, "age": "Adult", "pop": 4.0, "pers": "Casual", "hook": "Plot"}, "insp": {"y": true, "by": "Moldbreaker", "fmt": "Audiobook ONLY"}, "teach": {"y": false, "explore": null, "facts": null}, "cozy": {"y": true, "laugh": "NoJokes", "fmt": "Audiobook ONLY", "sunday": "TEDTalk"}, "hw": {"y": false, "tissue": 5.0, "ctype": "Hard truth about the world", "emotion": null, "fmt": "Audiobook ONLY"}, "fem": {"y": true, "night": "PowerSuits", "real": true}, "wild": {"y": false}, "cov": "/reads/covers/72ee311a26.webp"}, {"t": "Just Mercy", "a": "Bryan Stevenson", "r": 5.0, "fav": true, "type": "Memoir", "p": 336.0, "y": 2014.0, "rev": "This book is extraordinarily powerful, every American should read it. Bryan Stevenson, a real hero, built the Equal Justice Initiative to defend people the system had already written off. This book centers on the story of Walter McMillian, a Black man sentenced to death in Alabama for a crime he didn't commit, and weaves in stories of other poor, marginalized defendants Stevenson represented. It's horrifying, heartbreaking, and infuriating and yet not surprising to watch how deeply racism is baked into every level of our corrupted justice system, and how hard that is to actually combat. But it never tips into hopeless, you come away teary eyed and genuinely inspired by what patient, relentless advocacy can accomplish.", "pt": {"y": true, "age": "Adult", "pop": 4.0, "pers": "Insufferable", "hook": "Plot"}, "insp": {"y": true, "by": "Underdog", "fmt": "Either"}, "teach": {"y": true, "explore": "\ud83c\udf0e Our society", "facts": 2.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Either"}, "hw": {"y": false, "tissue": 8.0, "ctype": "Hard truth about the world", "emotion": null, "fmt": "Either"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}, "cov": "/reads/covers/d5e4e86154.webp"}, {"t": "Klara and the Sun", "a": "Kazuo Ishiguro", "r": 5.0, "fav": true, "type": "Fiction", "p": 303.0, "y": 2021.0, "rev": "Klara is an Artificial Friend built to be a child's companion, and Ishiguro tells this entire novel through her watchful, devoted, uncomprehending eyes. She spends her early days observing humans from a store window before a sickly girl named Josie picks her out, and what follows is Ishiguro's usual trick: enormous emotion delivered through the most restrained narration imaginable. Set in a near-future reshaped by genetic engineering, it's less about predicting AI than about what love and sacrifice look like from the outside. Quietly devastating by the end. One of my favorites.", "pt": {"y": true, "age": "Kid", "pop": 4.0, "pers": "Insufferable", "hook": "Prose + Characters"}, "insp": {"y": false, "by": "N/A", "fmt": "Book"}, "teach": {"y": false, "explore": null, "facts": null}, "cozy": {"y": true, "laugh": "NoJokes", "fmt": "Book", "sunday": "Enchanted"}, "hw": {"y": false, "tissue": 6.0, "ctype": "Quietly devastating", "emotion": null, "fmt": "Book"}, "fem": {"y": false, "night": null, "real": false}, "wild": {"y": true}, "cov": "/reads/covers/75b30668a7.webp"}, {"t": "Dare to Lead", "a": "Bren\u00e9 Brown", "r": 5.0, "fav": true, "type": "Nonfic", "p": 332.0, "y": 2018.0, "rev": "Do you think about the intersection of your leadership and your vulnerability? Bren\u00e9 Brown makes the case here that the willingness to have hard conversations, give real feedback, and stay in the room during conflict instead of avoiding it is what actually earns trust, not authority or armor. It's built directly on her earlier research into shame and connection, but pointed squarely at the workplace this time, specific enough that you can put it to use in your next one-on-one. A must if you manage people, or want to.", "pt": {"y": false, "age": null, "pop": 4.0, "pers": "Casual"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Audiobook"}, "teach": {"y": true, "explore": "\ud83d\udccb Your work", "facts": 3.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Audiobook"}, "hw": {"y": false, "tissue": 1.0, "ctype": "Someone's story", "emotion": null, "fmt": "Audiobook"}, "fem": {"y": true, "night": "PowerSuits", "real": true}, "wild": {"y": true}, "cov": "/reads/covers/a09da6b58e.webp"}, {"t": "Atlas of the Heart: Mapping Meaningful Connection and the Language of Human Experience", "a": "Bren\u00e9 Brown, Gavin Aung Than", "r": 5.0, "fav": true, "type": "Nonfic", "p": 301.0, "y": 2021.0, "rev": "Whenever I experience forboding joy, I think of Brene Brown, and her deep dive of nuanced emotions like these. This book reads like an encyclopedia of 87 emotions, each defined, organized, and illustrated, a wonderfully non-traditional way to think about your own feelings. I loved this idea that they're linked in families with one another, some that feel worlds apart turn out to be close cousins coming from the same deeper place. She draws out the nuances between similar ones: envy versus jealousy, worry versus anxiety, and it gave me actual language to get precise. Am I upset, or is something more specific going on, am I masking an emotion from myself? If you want to upgrade your emotional vocabularyand lead with more EQ, this is the book for you.", "pt": {"y": false, "age": null, "pop": 4.0, "pers": "Insufferable"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Book"}, "teach": {"y": true, "explore": "\ud83e\udde0 Your brain", "facts": 4.0}, "cozy": {"y": true, "laugh": "NoJokes", "fmt": "Book", "sunday": "TEDTalk"}, "hw": {"y": false, "tissue": 2.0, "ctype": "Someone's story", "emotion": null, "fmt": "Book"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}, "cov": "/reads/covers/b1c41e6ca1.webp"}, {"t": "How to Change Your Mind: The New Science of Psychedelics", "a": "Michael Pollan", "r": 5.0, "fav": true, "type": "Nonfic", "p": 480.0, "y": 2018.0, "rev": "This book is an absolute banger, an epic look at the history of psychedelics and their potential for improving the human condition. I loved it not for the novelty of the subject but for the appropriate caution, charming naivety, and utter lack of pretense with which Michael Pollan handles it. He traces psychedelics from the 1950s clinical trial boom through decades of prohibition to their current therapeutic comeback treating depression, addiction, and end-of-life anxiety, and tries the substances himself along the way. Given how life-changing and life-saving these drugs can be for people dealing with depression or PTSD, I honestly think Pollan, this unassuming older white man messenger, is exactly who we need to help move policy toward making them more accessible.", "pt": {"y": true, "age": "Adult", "pop": 4.0, "pers": "Insufferable", "hook": "Plot"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Audiobook"}, "teach": {"y": true, "explore": "\ud83e\udde0 Your brain", "facts": 2.0}, "cozy": {"y": false, "laugh": "DryWit", "fmt": "Audiobook"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Audiobook"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}, "cov": "/reads/covers/b55ff860ed.webp"}, {"t": "Breath: The New Science of a Lost Art", "a": "James Nestor", "r": 5.0, "fav": true, "type": "Nonfic", "p": 280.0, "y": 2020.0, "rev": "Breath brings so much more awareness to how we're actually breathing, and all the ways we're doing it wrong without even realizing it. James Nestor digs into the ancient practices, the history, and the anthropological side of how our jaws and airways have changed over generations (wild stuff!), then connects nasal breathing and breath-holding to everything from allergies to sleep to heart health. Ya girl became way more aware of the impact of my asthma/allergies and feeling connected to my body. He backs it all up with research and no a concerning amount of self-experimentation. For a book about breathing, this book was way more gripping than it has any right to be.", "pt": {"y": fa ase that success with money has a lot less to do with spreadsheets and a lot more to do with emotion and personal history, and he proves it in short, digestible essays on risk, luck, and compounding. Nothing here is revolutionary, but the arguments are well-made and the book moves fast enough that you won't get bogged down. Genuinely accessible even if finance books usually put you to sleep. A quick, solid read on why your temperament matters more than your math skills.", "pt": {"y": false, "age": null, "pop": 4.0, "pers": "Insufferable"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Either"}, "teach": {"y": true, "explore": "\ud83e\udde0 Your brain", "facts": 5.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Either"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Either"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}, "cov": "/reads/covers/156ad08cb8.webp"}, {"t": "Originals: How Non-Conformists Move the World", "a": "Adam M. Grant", "r": 5.0, "fav": true, "type": "Nonfic", "p": 326.0, "y": 2016.0, "rev": "Adam Grant spends this book dismantling the myths about what it takes to succeed. Turns out first movers rarely have the advantage we assume, it's the fast-followers who lower their risk and out-earn the 'pioneers.' The best entrepreneurs aren't big risk-takers either, they just diversify their risk, staying cautious in one area to cover a bet somewhere else. The lesson: being self-critical and honest about your own weaknesses is what actually builds trust.", "pt": {"y": false, "age": null, "pop": 3.0, "pers": "Casual"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Either"}, "teach": {"y": true, "explore": "\ud83d\udccb Your work", "facts": 3.0}, "cozy": {"y": false, "laugh": "DryWit", "fmt": "Either"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Either"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}, "cov": "/reads/covers/03e02102d6.webp"}, {"t": "Thinking in Bets: Making Smarter Decisions When You Don't Have All the Facts", "a": "Annie Duke", "r": 4.0, "fav": false, "type": "Nonfic", "p": 288.0, "y": 2018.0, "rev": "Annie Duke spent her career at the poker table learning that a good decision and a good outcome are not the same thing, and this book is her case for judging your choices by the quality of the reasoning instead of how things happened to turn out. She introduces useful tools like thinking probabilistically and forming decision groups to catch your own blind spots, drawing on both cognitive science and her own hands played. It's a genuinely useful mental model for anyone who beats themselves up over decisions that just got unlucky. A little repetitive by the back half, but the core idea earns its keep.", "pt": {"y": false, "age": null, "pop": 2.0, "pers": "Casual"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Audiobook"}, "teach": {"y": true, "explore": "\ud83d\udccb Your work", "facts": 3.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Audiobook"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Audiobook"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": false}, "cov": "/reads/covers/8720138d79.webp"}, {"t": "Good Habits, Bad Habits: The Science of Making Positive Changes That Stick", "a": "Wendy Wood", "r": 3.5, "fav": false, "type": "Nonfic", "p": 320.0, "y": 2019.0, "rev": "Willpower is a terrible strategy for actually changing your behavior, and Wendy Wood has decades of research to prove it: context, repetition, and environmental cues do the real work, not sheer force of will. She's specific about how restructuring your surroundings and routines can build good habits and break bad ones, and unafraid of debunking the popular habit myths that don't hold up under real data. It's more academic than most of its self-help shelf-mates, but the research underneath it is genuinely solid. Worth it if you want the science, not just the slogans.", "pt": {"y": false, "age": null, "pop": 2.0, "pers": "Casual"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Audiobook"}, "teach": {"y": true, "explore": "\ud83d\udccb Your work", "facts": 3.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Audiobook"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Audiobook"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": false}, "cov": "/reads/covers/c7287d4faf.webp"}, {"t": "Deep Work: Rules for Focused Success in a Distracted World", "a": "Cal Newport", "r": 3.5, "fav": false, "type": "Nonfic", "p": 296.0, "y": 2016.0, "rev": "Cal Newport argues that the ability to focus without distraction on cognitively demanding work, what he calls deep work, is becoming both rarer and more valuable in a world engineered to fragment your attention. He lays out concrete rules for protecting that focus, from scheduling dedicated blocks to ruthlessly cutting back on email and social media, drawing on academics and writers who've built their careers around sustained concentration. It's practical, if a little rigid in its prescriptions, no shades of gray allowed. It'll make you rethink your relationship with your phone whether you want to or not.", "pt": {"y": false, "age": null, "pop": 4.0, "pers": "Casual"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Book"}, "teach": {"y": true, "explore": "\ud83d\udccb Your work", "facts": 3.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Book"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Book"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": false}, "cov": "/reads/covers/59c2675061.webp"}, {"t": "Give and Take: A Revolutionary Approach to Success", "a": "Adam M. Grant", "r": 4.0, "fav": false, "type": "Nonfic", "p": 320.0, "y": 2013.0, "rev": "Adam Grant divides the world into three types: givers, takers, and matchers. However, the twist you wouldn't expect is that while generous givers actually outperform selfish takers over the long run, with real caveats about not letting generosity tip into being a doormat. He shows how givers can land at both the very bottom and the very top of success metrics depending on how they manage their own generosity, and digs into how organizations can protect them from being exploited by takers. Solid and well-researched, if a little more academic than his later, punchier books. Give strategically, not blindly.", "pt": {"y": false, "age": null, "pop": 5.0, "pers": "Casual"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Either"}, "teach": {"y": true, "explore": "\ud83d\udccb Your work", "facts": 3.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Either"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Either"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": false}, "cov": "/reads/covers/bb08dd11d2.webp"}, {"t": "Grit: The Power of Passion and Perseverance", "a": "Angela Duckworth", "r": 4.0, "fav": false, "type": "Nonfic", "p": 277.0, "y": 2016.0, "rev": "Angela Duckworth's central argument, that sustained passion and perseverance predict achievement better than raw talent, pulls from studies of West Point cadets, spelling bee competitors, and plenty of high performers who logged their hours the hard way. Going in as an existing fan of her research, I wanted more than what's here, it leans harder into over-explained pop psychology than the ideas actually require. Still, 2 things genuinely stuck: shame is a terrible tool for behavior change, and changing your environment beats relying on willpower almost every time. Worth it for those takeaways alone.", "pt": {"y": false, "age": null, "pop": 4.0, "pers": "Casual"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Audiobook"}, "teach": {"y": true, "explore": "\ud83d\udccb Your work", "facts": 3.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Audiobook"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, hour to recharge. A relief disguised as a research book.", "pt": {"y": false, "age": null, "pop": 3.0, "pers": "Casual"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Either"}, "teach": {"y": true, "explore": "\ud83e\udde0 Your brain", "facts": 3.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Either"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Either"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": false}, "cov": "/reads/covers/8543645760.webp"}, {"t": "Start with Why: How Great Leaders Inspire Everyone to Take Action", "a": "Simon Sinek", "r": 4.0, "fav": false, "type": "Nonfic", "p": 256.0, "y": 2009.0, "rev": "Simon Sinek's Golden Circle framework, start with why before how or what, is genuinely useful, and you'll recognize it instantly because every leadership coach you've ever sat through has already borrowed it wholesale. He proves the point with the same well-worn examples, Apple, the Wright Brothers, Martin Luther King Jr., and stretches a fairly simple insight further than it probably needs to go. The core idea earns its popularity, even if the book itself could have been a very long essay. Worth reading for the idea, not the padding.", "pt": {"y": false, "age": null, "pop": 4.0, "pers": "Casual"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Either"}, "teach": {"y": true, "explore": "\ud83d\udccb Your work", "facts": 3.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Either"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Either"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": false}, "cov": "/reads/covers/2a30d5274f.webp"}, {"t": "The Business of Belonging: How to Build Communities That Grow the Bottom Line", "a": "David Spinks", "r": 5.0, "fav": true, "type": "Nonfic", "p": 256.0, "y": 2021.0, "rev": "I'm probably more the target audience for this one than most people, but if you're a community builder or organizer in any way, David Spinks gives you a fantastic systematic approach to building engaged communities (tho do skip the drab first chapter). What stuck with me most is how intentional good community building actually is, it's not just one charismatic, high-EQ person holding a space together. In one example, a team decided every question in their community Slack needed at least 3 replies within 24 hours, so with every new question, they'd DM people to request input until that became the natural culture of the space on its own - a little \"if you build it, they will come\" but fostering community edition. It's one I've come back to many times.", "pt": {"y": false, "age": null, "pop": 1.0, "pers": "Casual"}, "insp": {"y": false, "by": "N/A", "fmt": "Book"}, "teach": {"y": true, "explore": "\ud83d\udccb Your work", "facts": 3.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Book"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Book"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}, "cov": "/reads/covers/91b58cb43b.webp"}, {"t": "The Culture Map: Breaking Through the Invisible Boundaries of Global Business", "a": "Erin Meyer", "r": 5.0, "fav": true, "type": "Nonfic", "p": 274.0, "y": 2014.0, "rev": "This book is such a helpful tool for anyone who works across borders or with folks from different cultures. Erin Meyer maps 8 dimensions, including directness, hierarchy, feedback, and how disagreement gets handled, across 60+ countries, focusing on where our differing cultural norms make it hardest to understand one another. It gives context for why my Filipino team would rarely-if-ever give me real feedback, or why my partners on the ground in Tokyo would say \"okay\" when that really meant \"girl absolutely not.\" (Incidentally, the US and Japan land as the two most polar opposite professional cultures from her mapping!) These distinctions are naturally learned over time, but her research has really helped me better anticipate and navigate misunderstandings before they arose.", "pt": {"y": false, "age": null, "pop": 2.0, "pers": "Casual"}, "insp": {"y": false, "by": "N/A", "fmt": "Either"}, "teach": {"y": true, "explore": "\ud83d\udccb Your work", "facts": 4.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Either"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Either"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}, "cov": "/reads/covers/de8c7581e4.webp"}, {"t": "Never Split the Difference: Negotiating As If Your Life Depended On It", "a": "Chris Voss, Tahl Raz", "r": 5.0, "fav": true, "type": "Nonfic", "p": 274.0, "y": 2016.0, "rev": "This is the kind of book that gets recommended to you five times over and you think, do I really want to read that? Turns out, yes, yes you do. Chris Voss spent his career talking kidnappers into releasing hostages, and it turns out tactical empathy, mirroring, and calibrated questions work disturbingly well on a used car salesman or a landlord who won't budge on rent too. It's a rare book thatt's immediately useful and the most powerful part to me was beyond the big negotiations in hashing out a salary or contract, but bringing all these tactics into my everyday conversations. One I need to reread and remind myself of.", "pt": {"y": false, "age": null, "pop": 5.0, "pers": "Insufferable"}, "insp": {"y": false, "by": "N/A", "fmt": "Either"}, "teach": {"y": true, "explore": "\ud83d\udccb Your work", "facts": 2.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Either"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Either"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}, "cov": "/reads/covers/9ab096caca.webp"}, {"t": "The Righteous Mind: Why Good People Are Divided by Politics and Religion", "a": "Jonathan Haidt", "r": 5.0, "fav": true, "type": "Nonfic", "p": 419.0, "y": 2012.0, "rev": "Jonathan Haidt sets out to explain why people across the political spectrum are each completely convinced they hold the moral high ground, and grounds the whole argument in real moral psychology instead of punditry. His Moral Foundations Theory, care, fairness, loyalty, authority, sanctity, reframes political disagreement as differing intuitions rather than differing levels of decency. It made me a noticeably more patient person in actual political conversations, which is not a small thing for a book to pull off. One of my favorites, and one I'd hand to anyone exhausted by the current discourse.", "pt": {"y": false, "age": null, "pop": 3.0, "pers": "Insufferable"}, "insp": {"y": false, "by": "N/A", "fmt": "Book"}, "teach": {"y": true, "explore": "\ud83c\udf0e Our society", "facts": 4.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Book"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Book"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}, "cov": "/reads/covers/2122d568d8.webp"}, {"t": "The Culture Code: The Secrets of Highly Successful Groups", "a": "Daniel Coyle", "r": 5.0, "fav": true, "type": "Nonfic", "p": 304.0, "y": 2017.0, "rev": "Fun and impactful business psych read for any team leader who cares about the culture they're building. Culture can be seen as fluffy, more about people being happy than actual outcomes, but Daniel Coyle takes a highly researched approach here, connecting culture directly to results. He studied highly elite teams: Navy SEAL units, Pixar animators, IDEO, and even a successful jewel theft gang. They all shared 3 skills: building safety, sharing vulnerability, and establishing purpose. His research showed it's less about hiring the smartest people and more about the small, repeated signals that everyone's safe enough to take a risk. He gives you a clear bar to aspire to with case studies that are genuinely actionable instead of vague inspo.", "pt": {"y": false, "age": null, "pop": 3.0, "pers": "Casual"}, "insp": {"y": false, "by": null, "fmt": "Either"}, "teach": {"y": true, "explore": "\ud83d\udccb Your work", "facts": 2.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Either"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Either"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}, "cov": "/reads/covers/10891646d8.webp"}, {"t": "Why We Sleep: Unlocking the Power of Sleep and Dreams", "a": "Matthew Walker", "r": 4.5, "fav": true, "type": "Nonfic", "p": 368.0, "y": 2017.0, "rev": "Matthew Walker makes an alarming and thoroughly convincing case that sleep deprivation is quietly wrecking your memory, immune system, and mood, and he backs it with the kind of research that's hard to argue with. I started guarding my 8 hours like a hawk after finishing this, and I've kept doing it since. Fair warning: you may develop mild anxiety about your own sleep habits, but honestly, that anxiety is doing you a favor. One of my favorites, and one that actually changed my behavior.", "pt": {"y": false, "age": null, "pop": 4.0, "pers": "Insufferable"}, "insp": {"y": false, "by": "N/A", "fmt": "Audiobook"}, "teach": {"y": true, "explore": "\ud83d\udc64 Your body", "facts": 3.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Audiobook"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Audiobook"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}, "cov": "/reads/covers/55e20e9e5f.webp"}, {"t": "Bringing Up B\u00e9b\u00e9: One American Mother Discovers the Wisdom of French Parenting", "a": "Pamela Druckerman, Abby Craden", "r": 4.0, "fav": false, "type": "Nonfic", "p": 432.0, "y": 2012.0, "rev": "I was second-hand recommending this book to soon-to-be-parent friends, based on other friends who loved it, so I finally dove in myself. Pamela Druckerman raises her kids in Paris and comes away convinced the French parents are onto something with patience, structure, and not narrating your toddler's every move. Her breakdown of French sleep training, mealtimes, and discipline is genuinely interesting, though there's definitely some fetishization of the French here.  It's not a parenting manual so much as a fascinating look at cultural differences in how we raise kids. And as a former elementary teacher, so much of it resonated. This felt like a parenting-focused sister book to The Coddling of the American Mind, reminding us how much we've over-parented and over-indulged our kids in this country, and this was a nice reminder of what parenting can look like outside our rat-race comparison culture.", "cov": "/reads/covers/fccec4f6df.webp", "col": "#e9e2c8", "pt": {"y": false, "age": null, "pop": 2.0, "pers": "Casual"}, "insp": {"y": false, "by": "N/A", "fmt": "Either"}, "teach": {"y": true, "explore": "\ud83d\udc6cYour relationships", "facts": 2.0}, "cozy": {"y": true, "laugh": "DryWit", "fmt": "Either", "sunday": "TEDTalk"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Either"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": false}}, {"t": "The Body: A Guide for Occupants", "a": "Bill Bryson", "r": 4.0, "fav": false, "type": "Nonfic", "p": 450.0, "y": 2019.0, "rev": "Bill Bryson turns his usual chatty curiosity toward human anatomy, and moves from head to toe through the brain, skin, digestion, and everything in between, weaving in little stories about the people behind each disease, cure, or discovery along the way. My big takeaway is that we know so much more about the body than we did a hundred years ago and yet still know almost nothing, especially about women's bodies. So many quotes like \"women are 10x more likely to get this disease, but why is anybody's guess.\" Not a book for medical professionals, but for the rest of us, I think Bryson can make anything interesting. Quick, easy read packed with trivia and little anecdotes that sneak up on you emotionally.", "pt": {"y": false, "age": null, "pop": 4.0, "pers": "Casual"}, "insp": {"y": false, "by": "N/A", "fmt": "Audiobook"}, "teach": {"y": true, "explore": "\ud83d\udc64 Your body", "facts": 3.0}, "cozy": {"y": true, "laugh": "DryWit", "fmt": "Audiobook", "sunday": "TEDTalk"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Audiobook"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": false}, "cov": "/reads/covers/dd42eea61e.webp"}, {"t": "Think Again: The Power of Knowing What You Don't Know", "a": "Adam M. Grant", "r": 4.0, "fav": false, "type": "Nonfic", "p": 307.0, "y": 2021.0, "rev": "The first rule of the Dunning-Kruger club is that you don't know you're a member of the Dunning-Kruger club. This book is about intellectual humility, and challenges us to get comfortable with not knowing, being wrong, and rethinking our own conventional wisdom, something our egos hate, backed by real psychological research and stories. I especially loved the sections on why it's so hard to get through to people, anti-vaxxers, election deniers, and how motivational reasoning can actually help move someone toward rethinking their beliefs. As Grant puts it, it takes humility to reconsider our past commitments, doubt to question our present decisions, and curiosity to reimagine our future plans. Be prepared for your own blind spots to get exposed.", "pt": {"y": false, "age": null, "pop": 4.0, "pers": "Casual"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Either"}, "teach": {"y": true, "explore": "\ud83d\udccb Your work", "facts": 2.0}, "cozy": {"y": false, "laugh": "DryWit", "fmt": "Either"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Either"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": false}, "cov": "/reads/covers/0fadf860a6.webp"}, {"t": "Hidden Potential: The Science of Achieving Greater Things", "a": "Adam M. Grant", "r": 3.5, "fav": false, "type": "Nonfic", "p": 304.0, "y": 2023.0, "rev": "Do you want to better identify and extract your own hidden potential? We're often wrong about what we and others are capable of, and Adam Grant uses great examples to show how we can meet goals and find fulfillment more reliably than raw talent alone predicts. His core idea is that becoming a creature of discomfort unlocks growth, it takes courage to abandon your tried-and-true methods, put yourself in the ring before you feel ready, and make more mistakes than most people even attempt. Most of us have dabbled in imposter syndrome from time to time, so I like Adam's advice that when we feel others are overestimating us, we're often underestimating ourselves: \"when multiple people believe in you, it might be time to believe them.\" I hope every leader who's ever judged a resume reads this.", "pt": {"y": false, "age": null, "pop": 3.0, "pers": "Casual"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Audiobook"}, "teach": {"y": true, "explore": "\ud83d\udccb Your work", "facts": 3.0}, "cozy": {"y": false, "laugh": "DryWit", "fmt": "Audiobook"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Audiobook"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": false}, "cov": "/reads/covers/e502c7ec38.webp"}, {"t": "Keep Sharp: Build a Better Brain at Any Age", "a": "Sanjay Gupta", "r": 3.5, "fav": false, "type": "Nonfic", "p": 336.0, "y": 2021.0, "rev": "Sanjay Gupta lays out a comprehensive, research-backed case for keeping your brain healthy as you age, built on interviews with neuroscientists and centenarians who are still sharp as ever, with an emphasis on staving off the dementia related illnesses we all fear most. He skips the fear-mongering a lot of brain-health books lean on and sticks to five specific, evidence-backed goals: diet, exercise, social connection, and a few others that add up fast. There's a 12-week program built in, so you close the book with an actual plan instead of just good intentions. A little dry in delivery, but useful enough to forgive that.", "pt": {"y": false, "age": null, "pop": 3.0, "pers": "Casual"}, "insp": {"y": false, "by": "N/A", "fmt": "Audiobook"}, "teach": {"y": true, "explore": "\ud83d\udc64 Your body", "facts": 3.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Audiobook"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Audiobook"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": false}, "cov": "/reads/covers/be0562d255.webp"}, {"t": "Propaganda", "a": "Edward L. Bernays, Mark Crispin Miller", "r": 4.0, "fav": false, "type": "Nonfic", "p": 168.0, "y": 1928.0, "rev": "Caveat upfront: recommending this one feels a little like telling someone to eat their veggies when they want dessert. But it's genuinely fascinating to read the origin story of modern propaganda and see exactly how we got here. Edward Bernays wrote this book in 1928, back when \"propaganda\" wasn't a dirty word, it barely had any connotation at all, and he lays the foundation stone for manipulation techniques still used across politics, business, and interest groups today. He argues, without a hint of embarrassment, that manipulating public opinion isn't just possible but necessary for democracy to function. It's a dizzying, eerily prescient vision of how propaganda regiments the collective mind, one that holds up chillingly well today. Short and chilling.", "cov": "/reads/covers/a7651c9679.webp", "col": "#b45c00", "pt": {"y": false, "age": null, "pop": 1.0, "pers": "Casual"}, "insp": {"y": false, "by": "N/A", "fmt": "Either"}, "teach": {"y": true, "explore": "\ud83d\udd70\ufe0f Our history", "facts": 4.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Either"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Either"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": false}}, {"t": "This Is Your Mind on Plants", "a": "Michael Pollan", "r": 4.0, "fav": false, "type": "Nonfic", "p": 288.0, "y": 2021.0, "rev": "Michael Pollan turns his curiosity toward 3 psychoactive plants, opium, caffeine, and ": "\ud83d\udccb Your work", "facts": 2.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Either"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Either"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": false}, "cov": "/reads/covers/4af04ff886.webp"}, {"t": "Measure What Matters", "a": "John Doerr", "r": 3.5, "fav": false, "type": "Nonfic", "p": 299.0, "y": 2017.0, "rev": "John Doerr traces OKRs back to Andy Grove's Intel and forward to Google, where Doerr introduced the framework as an early investor, and builds the case for setting ambitious, measurable goals instead of vague ones. The case studies from Google, the Gates Foundation, and Intuit make the framework feel tested rather than theoretical. It's genuinely useful if you're implementing this at work, less so if you're reading purely for curiosity, since it reads more like a manual than a narrative. Worth it if OKRs are actually on your to-do list.", "pt": {"y": false, "age": null, "pop": 3.0, "pers": "Casual"}, "insp": {"y": false, "by": null, "fmt": "Book"}, "teach": {"y": true, "explore": "\ud83d\udccb Your work", "facts": 3.0}, "cozy": {"y": false, "laugh": "NoJokes", "fmt": "Book"}, "hw": {"y": false, "tissue": 0.0, "ctype": null, "emotion": null, "fmt": "Book"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": false}, "cov": "/reads/covers/ca94c0d27e.webp"}, {"t": "The Power of Moments: Why Certain Experiences Have Extraordinary Impact", "a": "Chip Heath, Dan Heath", "r": 3.5, "fav": false, "type": "Nonfic", "p": 320.0, "y": 2017.0, "rev": "Chip and Dan Heath open with a great question: why does time feel like it flies, yet you can't remember where an entire year actually went? Their answer is that we run on scripts and patterns because they're easy, so nothing stands out and the days blur together. The fix is engineering real moments on purpose, built from elevation, rising above the everyday, pride in a milestone, insight into a truth, or bination of the most soothing content of all time and the most soothing British accent of all time, this audiobook on 0.8x speed has been my insomnia cure for 6 years now. So you're thinking 'really Jess, this is your top rec for me?' But I must say - if you can stay awake for it, this book's content is meditative and deeply grounding. You're open to the world we never consider where trees are wise social beings, that help each other out. It's deliberate slow pace has you slowing down and looking at these beautiful living things that feed us, cool us down, help us breathe. A walk in the forest will never be the same again.", "pt": {"y": false, "age": null, "pop": 3.0, "pers": "Casual"}, "insp": {"y": false, "by": "N/A", "fmt": "Audiobook"}, "teach": {"y": true, "explore": "\ud83c\udf0e Our society", "facts": 2.0}, "cozy": {"y": true, "laugh": "NoJokes", "fmt": "Audiobook", "sunday": "TEDTalk"}, "hw": {"y": false, "tissue": 1.0, "ctype": null, "emotion": null, "fmt": "Audiobook"}, "fem": {"y": false, "night": null, "real": true}, "wild": {"y": true}, "cov": "/reads/covers/40de09ef83.webp"}, {"t": "Permission to Feel: The Power of Emotional Intelligence to Achieve Well-Being and Success", "a": "Marc Brackett", "r": 3.5, "fav": false, "type": "Nonfic", "p": 304.0, "y": 2019.0, "rev": "Marc Brackett wants emotional intelligence taught with the same rigor as math, and builds his RULER method, recognizing, understanding, labeling, expressing, and regulating emotions, to actually do it. He roots the whole framework in his own childhood with an emotionally attuned uncle, which keeps it from feeling purely academic even when the delivery leans textbook-y. The sections on implementing RULER in real schools, and what changed for the kids there, are the most convincing part. The framework itself is worth stealing regardless.", "pt": {"y": false, "age": null, "pop": 1.0, "pers": "Casual"}, "insp": {"y": true, "by": "MindsetShift", "fmt": "Either"}, "teach": {"y": true, "explore"
